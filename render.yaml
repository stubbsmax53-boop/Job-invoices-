# Job intake & invoicing on Render (web service + Postgres).
# Free web services spin down after 15 minutes idle; free Postgres expires
# 30 days after creation (14-day grace period to upgrade). See:
# https://render.com/docs/free
services:
  - type: web
    name: job-invoices
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: job-invoices-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: job-invoices-db
    plan: free
    databaseName: invoices
    # Internal-only: the web service uses the private connectionString.
    # To inspect the database from a laptop, remove this or add your IP.
    ipAllowList: []
